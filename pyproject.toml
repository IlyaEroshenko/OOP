[project]
name = "pythonoop"
version = "0.1.0"
description = ""
authors = [
    {name = "Ily",email = "ilyeroshenko@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "products (>=2.0.1,<3.0.0)",
    "pytest (>=9.0.2,<10.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.3.0,<8.0.0)",
    "mypy (>=1.19.1,<2.0.0)",
    "isort (>=7.0.0,<8.0.0)",
    "black (>=25.12.0,<26.0.0)"
]

[tool.mypy]
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
exclude = 'venv'
